name: LocalLLMChat
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true

packages:
  coreai-kit:
    url: https://github.com/john-rocky/coreai-kit
    exactVersion: 0.7.3
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    revision: 5f7c04e0558df6146f90d482edb62cb456986bda

schemes:
  LocalLLMChat:
    build:
      targets:
        LocalLLMChat: all
        LocalLLMGateway: all
        LocalLLMWorker: all
        LocalLLMChatTests: [test]
    run:
      config: Release
    test:
      config: Debug
      targets:
        - LocalLLMChatTests

targets:
  LocalLLMChat:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Sources
      # launchd job for SMAppService.agent; BundleProgram points into LoginItems/.
      - path: Config/com.example.localllmchat.gateway.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
      - target: LocalLLMGateway
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localllmchat
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: "NO"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  LocalLLMGateway:
    # A helper .app (not a bare tool): XPC service lookup is relative to the main bundle, so
    # the embedded worker is only visible from inside an app. See Spikes/EmbeddedXPC.
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Gateway
      - path: Sources/Gateway
      - path: Sources/Shared
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
      - target: LocalLLMWorker
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/XPCServices
    settings:
      base:
        PRODUCT_NAME: LocalLLMGateway
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localllmchat.gateway
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Creates the daily news digest in Pages."
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: "NO"
        SKIP_INSTALL: "YES"
  LocalLLMWorker:
    type: xpc-service
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Worker
      - path: Sources/Shared
    dependencies:
      - package: coreai-kit
        product: CoreAIKit
    info:
      path: Config/LocalLLMWorker-Info.plist
      properties:
        CFBundlePackageType: XPC!
        CFBundleName: LocalLLMWorker
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_NAME: LocalLLMWorker
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localllmchat.worker
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Config/LocalLLMWorker-Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: "NO"
        SKIP_INSTALL: "YES"
  LocalLLMChatTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: Tests
    dependencies:
      - target: LocalLLMChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.localllmchat.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LocalLLMChat.app/Contents/MacOS/LocalLLMChat"
        BUNDLE_LOADER: "$(TEST_HOST)"
